# DXVK settings for The Sims 2. Put this in TSBin, next to Sims2EP9.exe.
#
# DXVK's own profile for The Sims 2 reports 2 GB of video memory. The Switch's
# GPU heap is 1.5 GB and shared with everything else, so the game fills it and
# crashes. 512 MB is what the game gets here instead.
d3d9.maxAvailableMemory = 512
